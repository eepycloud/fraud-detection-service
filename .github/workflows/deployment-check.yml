name: Live deployment checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the public scoring and monitoring API
        run: python tests/smoke_test.py https://fraud-detection-service-srsh.onrender.com
      - name: Install cloud browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify replay and dashboard on desktop and mobile
        run: python tests/browser_check.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-dashboard-verification
          retention-days: 3
          path: reports/
