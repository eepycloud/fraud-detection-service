name: Cloud model training
on:
  workflow_dispatch:
    inputs:
      force:
        description: Train a review candidate even without detected drift
        type: boolean
        default: true
      compare_torch:
        description: Run the optional CPU PyTorch comparison
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - src/train.py
      - src/retrain.py
      - src/compare_torch.py
      - .github/workflows/cloud-training.yml
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
concurrency:
  group: cloud-model-training
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to train
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import urlopen
          event=os.environ["GITHUB_EVENT_NAME"]
          needed=event=="push" or os.environ.get("FORCE")=="true"
          if not needed:
              with urlopen("https://fraud-detection-service-srsh.onrender.com/api/monitor?source=live",timeout=90) as r:
                  report=json.load(r)
              needed=any(d["psi"] is not None and d["psi"]>=0.2 for d in report["drift"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("needed="+str(needed).lower()+"\n")
          print("Candidate training required:",needed)
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.needed == 'true'
        with:
          python-version: '3.12'
      - name: Install training dependencies
        if: steps.gate.outputs.needed == 'true'
        run: |
          python -m pip install -r requirements.txt kagglehub==1.0.3
      - name: Download public simulated data
        if: steps.gate.outputs.needed == 'true'
        run: python -u src/download_data.py
      - name: Train and evaluate a review candidate
        if: steps.gate.outputs.needed == 'true'
        run: python -u src/retrain.py --force
      - name: Install CPU PyTorch
        if: steps.gate.outputs.needed == 'true' && (github.event_name == 'push' || inputs.compare_torch == true)
        run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compare the neural network
        if: steps.gate.outputs.needed == 'true' && (github.event_name == 'push' || inputs.compare_torch == true)
        run: python -u src/compare_torch.py --epochs 15
      - name: Summarize evaluation
        if: steps.gate.outputs.needed == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("# Cloud training results\n\nNo serving model was replaced.\n\n")
              for path in sorted(Path("models/candidates").glob("*/review.json")):
                  out.write("## Candidate review\n\n```json\n"+path.read_text()+"\n```\n")
              path=Path("models/torch_metrics.json")
              if path.exists():
                  out.write("## PyTorch comparison\n\n```json\n"+path.read_text()+"\n```\n")
          PY
      - name: Save small review artifacts
        if: steps.gate.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-review-${{ github.run_number }}
          retention-days: 3
          path: |
            models/candidates/
            models/torch_metrics.json
            models/comparison.pt
            models/torch_preprocessor.joblib
